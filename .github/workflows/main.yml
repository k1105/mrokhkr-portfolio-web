name: Build & Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 毎日UTC 0:00に実行（日本時間 9:00）
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 前回ビルドの最適化済み画像をキャッシュから復元
      - uses: actions/cache@v4
        with:
          path: public/images
          key: optimized-images-${{ github.run_id }}
          restore-keys: |
            optimized-images-

      - run: npm ci

      # Notion から画像をダウンロード＆最適化
      - name: Optimize images
        run: npx tsx scripts/optimize-images.mts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKS_DATASOURCE_ID: ${{ secrets.NOTION_WORKS_DATASOURCE_ID }}
          NOTION_MEDIA_ARCHIVES_DATASOURCE_ID: ${{ secrets.NOTION_MEDIA_ARCHIVES_DATASOURCE_ID }}
          NOTION_DIARY_DATASOURCE_ID: ${{ secrets.NOTION_DIARY_DATASOURCE_ID }}
          NOTION_CONTENTS_DATASOURCE_ID: ${{ secrets.NOTION_CONTENTS_DATASOURCE_ID }}

      # main ブランチ: 本番ビルド、それ以外: プレビュービルド
      - name: Build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel build --yes --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKS_DATASOURCE_ID: ${{ secrets.NOTION_WORKS_DATASOURCE_ID }}
          NOTION_MEDIA_ARCHIVES_DATASOURCE_ID: ${{ secrets.NOTION_MEDIA_ARCHIVES_DATASOURCE_ID }}
          NOTION_DIARY_DATASOURCE_ID: ${{ secrets.NOTION_DIARY_DATASOURCE_ID }}
          NOTION_CONTENTS_DATASOURCE_ID: ${{ secrets.NOTION_CONTENTS_DATASOURCE_ID }}

      # main ブランチ: 本番デプロイ、それ以外: プレビューデプロイ（URLを出力）
      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tee /tmp/deploy-url.txt
            echo "## Preview URL" >> "$GITHUB_STEP_SUMMARY"
            echo "$(cat /tmp/deploy-url.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
